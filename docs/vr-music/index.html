  <button class="music" id="music" type="button" aria-label="开启音乐" aria-pressed="false" aria-controls="bgm">

</main><noscript><p class="noscript-message">请启用 JavaScript 后查看园林。</p></noscript><script src="photo-vr-index-v17.js?load=20261030d"></script><script src="viewer-ui-v17.js?load=20261030d"></script><script>
    (() => {
      const button = document.getElementById('music');
      const label = document.getElementById('music-state');
      const message = document.getElementById('music-message');
      const audio = document.getElementById('bgm');
      let wanted = false;
      let sequence = 0;
      function render(state) {
        button.setAttribute('aria-pressed', wanted ? 'true' : 'false');
        button.setAttribute('aria-label', wanted ? '关闭音乐' : '开启音乐');
        button.setAttribute('aria-busy', state === 'loading' ? 'true' : 'false');
        label.textContent = wanted ? (state === 'loading' ? '加载中' : '开') : '关';
      }
      function stop() {
        wanted = false;
        sequence += 1;
        audio.pause();
        message.textContent = '';
        render('off');
      }
      button.addEventListener('click', async () => {
        if (wanted) { stop(); return; }
        wanted = true;
        const ticket = ++sequence;
        message.textContent = '';
        render('loading');
        if (!audio.getAttribute('src')) audio.src = new URL('./bgm.mp3', location.href).href;
        try {
          await audio.play();
          if (!wanted) audio.pause();
          if (ticket === sequence) render(wanted ? 'on' : 'off');
        } catch (error) {
          if (ticket !== sequence) return;
          wanted = false;
          render('off');
          message.textContent = '音乐未能播放，请再点一次重试。';
        }
      });
      audio.addEventListener('playing', () => { if (!wanted) audio.pause(); else render('on'); });
      audio.addEventListener('error', () => {
        if (!wanted) return;
        wanted = false;
        sequence += 1;
        render('off');
        message.textContent = '音乐加载失败，请点按重试。';
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden && wanted) stop(); });
      render('off');
    })();
  </script></body></html>
